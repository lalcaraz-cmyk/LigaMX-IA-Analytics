[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ligamx-ia-analytics"
version = "0.1.0"
description = "AI-powered analytics and prediction platform for Liga MX."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Luis Felipe Alcaraz Murillo" }
]
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "orjson>=3.10",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "tenacity>=9.0",
]

[project.urls]
Repository = "https://github.com/<YOUR_GITHUB_USERNAME>/ligamx-ia-analytics"
Issues = "https://github.com/<YOUR_GITHUB_USERNAME>/ligamx-ia-analytics/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
fix = true
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
